/auth/otp/request:
  post:
    operationId: v1.auth.otp.request
    description: |-
      Envoie un code à 6 chiffres (valable 5 minutes) par SMS ou WhatsApp. Le
      conducteur doit être pré-enregistré par le back-office : l'application
      mobile ne crée pas de compte.

      Limité à 3 envois par tranche de 10 minutes et par numéro.

      En développement et en test (`WIGO_OTP_EXPOSE_CODE`), la réponse contient
      en plus le champ `code` : il est toujours absent en production.
    summary: 'Demander un code OTP'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/OtpRequestRequest.yaml
    responses:
      200:
        description: ''
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  examples:
                    - 'Un code de connexion vous a été envoyé. Il expire dans 5 minutes.'
                data:
                  type: object
                  properties:
                    channel:
                      type: string
                      enum:
                        - sms
                        - whatsapp
                    expires_at:
                      type: string
                      examples:
                        - '2026-08-29T09:47:11Z'
                    code:
                      type: string
                      description: |-
                        Uniquement en développement et en recette
                        (`WIGO_OTP_EXPOSE_CODE`) : absent en production.
                      examples:
                        - '482913'
                  required:
                    - channel
                    - expires_at
              required:
                - message
                - data
      422:
        $ref: ../components/responses/ValidationException.yaml
    security: {}
/auth/otp/verify:
  post:
    operationId: v1.auth.otp.verify
    description: |-
      Délivre un jeton Sanctum portant l'habilitation `mobile:*`, à placer dans
      l'en-tête `Authorization: Bearer <token>`. Plusieurs codes peuvent être
      valides simultanément ; une vérification réussie les consomme tous.

      Après 5 saisies erronées, le numéro est verrouillé 15 minutes.
    summary: "Vérifier l'OTP et obtenir un jeton"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/OtpVerifyRequest.yaml
    responses:
      200:
        description: ''
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                data:
                  type: object
                  properties:
                    token:
                      type: string
                      description: 'Jeton Sanctum, à présenter en `Authorization: Bearer <token>`.'
                      examples:
                        - 14|9f1c2b7e4d3a4f8b9c2e1a5d6b7c8e90wYjKQpX7ZmN3vB8cA2dE
                    driver:
                      $ref: ../components/schemas/DriverResource.yaml
                    terms:
                      type: object
                      properties:
                        current_version:
                          type: string
                          examples:
                            - '1.0'
                        accepted:
                          type: boolean
                      required:
                        - current_version
                        - accepted
                  required:
                    - token
                    - driver
                    - terms
              required:
                - message
                - data
      422:
        $ref: ../components/responses/ValidationException.yaml
    security: {}
/auth/logout:
  post:
    operationId: v1.auth.logout
    description: |-
      Révoque uniquement le jeton présenté ; les autres appareils du conducteur
      restent connectés.
    summary: 'Se déconnecter'
    responses:
      200:
        description: ''
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  examples:
                    - 'Vous avez été déconnecté.'
                data:
                  type: object
                  additionalProperties:
                    type: object
              required:
                - message
                - data
      401:
        $ref: ../components/responses/AuthenticationException.yaml
/me:
  get:
    operationId: v1.me
    description: |-
      Accessible même lorsque le compte est suspendu, afin que l'application
      puisse afficher le motif et permettre la déconnexion.
    summary: 'Profil du conducteur'
    responses:
      200:
        description: ''
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  description: 'Message prêt à afficher, en français.'
                data:
                  $ref: ../components/schemas/DriverResource.yaml
              required:
                - message
                - data
      401:
        $ref: ../components/responses/AuthenticationException.yaml
/me/push-token:
  put:
    operationId: v1.push-token
    description: 'Requis pour recevoir les notifications push (messages data-only).'
    summary: "Enregistrer le jeton FCM de l'appareil"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/UpdatePushTokenRequest.yaml
    responses:
      200:
        description: ''
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  examples:
                    - 'Jeton de notification enregistré.'
                data:
                  type: object
                  additionalProperties:
                    type: object
              required:
                - message
                - data
      401:
        $ref: ../components/responses/AuthenticationException.yaml
      422:
        $ref: ../components/responses/ValidationException.yaml
/me/photo:
  post:
    operationId: v1.photo.update
    description: |-
      Remplace la photo du conducteur : le profil est mis à jour aussitôt, il
      n'y a pas de validation par un agent. L'ancienne photo est supprimée du
      disque dans la foulée.

      Accessible même lorsque le compte est suspendu — la photo relève du
      profil, pas des opérations métier.
    summary: 'Changer ma photo de profil'
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            $ref: ../components/schemas/UpdateDriverPhotoRequest.yaml
    responses:
      200:
        description: ''
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  examples:
                    - 'Votre photo de profil a été mise à jour.'
                data:
                  type: object
                  properties:
                    photo_url:
                      type: string
                      examples:
                        - 'https://cdn.wigopro.example/drivers/01HZY3M4N5P6Q7R8S9T0V1W2X3/photo.jpg?signature=…'
                  required:
                    - photo_url
              required:
                - message
                - data
      401:
        $ref: ../components/responses/AuthenticationException.yaml
      422:
        $ref: ../components/responses/ValidationException.yaml
'/me/photo/{driver}':
  get:
    operationId: v1.photo
    description: |-
      Route signée et temporaire, dont l'URL est fournie par `photo_url` du
      profil. La signature ne vaut pas autorisation : le conducteur
      authentifié doit être celui de la photo.
    summary: 'Télécharger ma photo de profil'
    parameters:
      -
        name: driver
        in: path
        required: true
        description: 'The driver ID'
        schema:
          type: string
    responses:
      200:
        description: ''
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
        headers:
          Transfer-Encoding:
            required: true
            schema:
              type: string
              enum:
                - chunked
      403:
        description: 'An error'
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  description: 'Error overview.'
                  examples:
                    - "Vous n'avez pas accès à cette ressource."
              required:
                - message
      404:
        $ref: ../components/responses/ModelNotFoundException.yaml
      401:
        $ref: ../components/responses/AuthenticationException.yaml
