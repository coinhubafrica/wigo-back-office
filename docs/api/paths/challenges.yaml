/challenges:
  get:
    operationId: v1.challenges
    description: |-
      Un élément par challenge ouvert, avec la progression propre au
      conducteur : tickets détenus et courses restantes avant le prochain pour
      une tombola, rang et prime pour un classement, gain éventuel. Les blocs
      `ticketing`, `leaderboard` et `won` ne sont présents que lorsqu'ils
      s'appliquent au challenge.

      `ticketing.tickets` détaille les tickets détenus, du plus ancien au plus
      récent : leur date d'obtention et leur numéro de tirage, ce dernier
      n'étant attribué qu'au gel du vivier.

      `rules_document` porte le règlement du challenge quand il en a un, par
      URL signée valable une heure.

      `meta.weekly_history` porte les douze dernières semaines de courses
      terminées, de la plus ancienne à la semaine en cours.

      Reste accessible à un conducteur radié, comme le profil : ses
      compteurs cessent simplement de progresser.
    summary: 'Challenges en cours du conducteur'
    responses:
      200:
        description: ''
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        examples:
                          - 01HZY3M4N5P6Q7R8S9T0V1W2X3
                      reference:
                        type: string
                        examples:
                          - CH-2026-039
                      name:
                        type: string
                        examples:
                          - 'Tombola de la rentrée'
                      type:
                        type: string
                        enum:
                          - leaderboard
                          - raffle
                          - surprise
                        # L'exemple d'ensemble porte un bloc `ticketing` : le
                        # type doit être celui d'une tombola, sans quoi
                        # l'exemple se contredirait.
                        example: raffle
                      status:
                        type: string
                        enum:
                          - active
                          - draw_pending
                          - payout_pending
                      criteria_summary:
                        type: string
                        examples:
                          - '1 ticket toutes les 10 courses terminées'
                      period:
                        type: object
                        properties:
                          start:
                            type: string
                            examples:
                              - '2026-08-25'
                          end:
                            type: string
                            examples:
                              - '2026-08-31'
                          week_iso:
                            type:
                              - string
                              - 'null'
                            examples:
                              - '2026-W35'
                        required:
                          - start
                          - end
                          - week_iso
                      prize:
                        type:
                          - object
                          - 'null'
                        properties:
                          name:
                            type: string
                            examples:
                              - 'Casque Bluetooth'
                          photo_url:
                            type:
                              - string
                              - 'null'
                            examples:
                              - 'https://cdn.wigopro.example/challenges/casque-bluetooth.jpg'
                        required:
                          - name
                          - photo_url
                      rules_document:
                        type:
                          - object
                          - 'null'
                        description: "Règlement du challenge, ou `null` s'il n'en a pas."
                        properties:
                          url:
                            type: string
                            description: 'URL signée, valable une heure.'
                            examples:
                              - 'https://api.wigopro.example/api/v1/challenges/01HZY3M4N5P6Q7R8S9T0V1W2X3/rules?signature=…'
                          original_name:
                            type: string
                            examples:
                              - reglement-CH-2026-039.pdf
                          mime_type:
                            type: string
                            examples:
                              - application/pdf
                          size_bytes:
                            type: integer
                            description: 'Taille en octets.'
                            examples:
                              - 184320
                        required:
                          - url
                          - original_name
                          - mime_type
                          - size_bytes
                      ticketing:
                        type: object
                        description: |-
                          Absent des challenges qui n'attribuent pas de
                          tickets. L'exemple montre un challenge encore
                          `active` : les `range_number` n'y sont pas encore
                          attribués, le vivier n'étant gelé qu'au passage en
                          `draw_pending`.
                        example:
                          trips_per_ticket: 10
                          orders_completed: 34
                          tickets_held: 3
                          progress_in_block: 4
                          orders_to_next_ticket: 6
                          tickets:
                            -
                              id: 01HZY3M4N5P6Q7R8S9T0V1W2X3
                              date: '2026-08-26'
                              range_number: null
                            -
                              id: 01HZY4P7Q8R9S0T1V2W3X4Y5Z6
                              date: '2026-08-28'
                              range_number: null
                            -
                              id: 01HZY5R9S0T1V2W3X4Y5Z6A7B8
                              date: '2026-08-30'
                              range_number: null
                        properties:
                          trips_per_ticket:
                            type: integer
                            examples:
                              - 10
                          orders_completed:
                            type: integer
                            examples:
                              - 34
                          tickets_held:
                            type: integer
                            examples:
                              - 3
                          progress_in_block:
                            type: integer
                            examples:
                              - 4
                          orders_to_next_ticket:
                            type: integer
                            examples:
                              - 6
                          tickets:
                            type: array
                            description: |-
                              Tickets détenus, du plus ancien au plus récent.
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                  examples:
                                    - 01HZY3M4N5P6Q7R8S9T0V1W2X3
                                date:
                                  type: string
                                  description: "Jour où le ticket a été gagné."
                                  examples:
                                    - '2026-08-26'
                                range_number:
                                  type:
                                    - integer
                                    - 'null'
                                  description: |-
                                    Numéro de tirage, attribué au gel du vivier
                                    seulement : `null` avant.
                                  examples:
                                    - 1043
                              required:
                                - id
                                - date
                                - range_number
                        required:
                          - trips_per_ticket
                          - orders_completed
                          - tickets_held
                          - progress_in_block
                          - orders_to_next_ticket
                          - tickets
                      leaderboard:
                        type: object
                        properties:
                          rank:
                            type:
                              - integer
                              - 'null'
                            examples:
                              - 4
                          winning_places:
                            type: integer
                            examples:
                              - 10
                          reward_amount:
                            type:
                              - integer
                              - 'null'
                            examples:
                              - 15000
                          in_winning_range:
                            type: boolean
                        required:
                          - rank
                          - winning_places
                          - reward_amount
                          - in_winning_range
                      won:
                        type: object
                        properties:
                          drawn_at:
                            type:
                              - string
                              - 'null'
                            examples:
                              - '2026-08-31T20:00:00Z'
                          prize_name:
                            type:
                              - string
                              - 'null'
                            examples:
                              - 'Casque Bluetooth'
                          amount:
                            type:
                              - integer
                              - 'null'
                            examples:
                              - 15000
                          credited:
                            type: boolean
                          collection_note:
                            type: string
                            examples:
                              - "À retirer à l'agence Cocody Angré sous 30 jours."
                        required:
                          - drawn_at
                          - prize_name
                          - amount
                          - credited
                    required:
                      - id
                      - reference
                      - name
                      - type
                      - status
                      - criteria_summary
                      - period
                      - prize
                      - rules_document
                meta:
                  type: object
                  properties:
                    weekly_history:
                      type: array
                      items:
                        type: object
                        properties:
                          week_iso:
                            type: string
                            examples:
                              - '2026-W35'
                          label:
                            type: string
                            examples:
                              - '25–31 août'
                          orders_completed:
                            type: integer
                            examples:
                              - 34
                          current:
                            type: boolean
                            examples:
                              - true
                        required:
                          - week_iso
                          - label
                          - orders_completed
                          - current
                  required:
                    - weekly_history
              required:
                - message
                - data
                - meta
      401:
        $ref: ../components/responses/AuthenticationException.yaml
'/challenges/{challenge}/rules':
  get:
    operationId: v1.challenges.rules
    description: |-
      Accessible par URL signée seulement : le fichier vit sur le disque privé
      et n'a pas d'URL publique. Un challenge inconnu ou sans règlement répond
      403, jamais 404 — l'écart entre les deux dirait quels challenges
      existent.
    summary: "Télécharger le règlement d'un challenge"
    parameters:
      -
        name: challenge
        in: path
        required: true
        description: 'The challenge ID'
        schema:
          type: string
    responses:
      200:
        description: 'Le fichier, servi depuis le disque privé.'
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      403:
        description: 'An error'
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  description: 'Message prêt à afficher, en français.'
              required:
                - message
      401:
        $ref: ../components/responses/AuthenticationException.yaml
