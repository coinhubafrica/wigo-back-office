/history:
  get:
    operationId: v1.history.index
    description: |-
      Recharges, commandes de pièces, cotisations CNPS déclarées et tickets de
      bonus dans un seul ordre, du plus récent au plus ancien.

      Chaque ligne porte son montant en trois parties : `amount.value` est une
      magnitude toujours positive, `amount.sign` dit le sens (-1 sortie, +1
      entrée, 0 sans mouvement de notre côté) et `amount.unit` vaut `XOF` ou
      `ticket`. L'application se règle sur `sign` seul pour la couleur et le
      préfixe : elle n'a pas à connaître les familles.

      Pagination par curseur : `meta.next_cursor` porte le curseur suivant
      (`null` sur la dernière page), à renvoyer dans `?cursor=`. `per_page` est
      plafonné à 50 — l'accueil demande `per_page=5` et ignore le curseur.
    summary: "Fil d'activité"
    parameters:
      -
        name: per_page
        in: query
        schema:
          type: integer
          default: 20
      -
        name: cursor
        in: query
        schema:
          type: string
    responses:
      200:
        description: ''
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  description: 'Message prêt à afficher, en français.'
                data:
                  type: array
                  items:
                    $ref: ../components/schemas/HistoryEntryPayload.yaml
                meta:
                  type: object
                  description: 'Pagination par curseur : `per_page`, `next_cursor` (`null` sur la dernière page).'
                links:
                  type: object
                  description: "Liens de pagination (`next`, `prev`) lorsqu'ils existent."
              required:
                - message
                - data
      401:
        $ref: ../components/responses/AuthenticationException.yaml
