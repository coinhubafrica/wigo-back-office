/shop/products:
  get:
    operationId: v1.shop.products
    description: |-
      Les pièces disponibles à la commande, triées par nom.

      `fits_my_vehicle=1` restreint aux pièces qui vont sur le véhicule du
      conducteur, pièces universelles comprises. Le filtre est sans effet —
      catalogue complet — si le conducteur n'a pas de véhicule ou si son
      modèle n'est pas au référentiel : mieux vaut tout montrer qu'une
      boutique vide.

      Pagination par curseur : `meta.next_cursor` porte le curseur suivant
      (`null` sur la dernière page), à renvoyer dans `?cursor=`. `per_page`
      est plafonné à 50.
    summary: 'Catalogue de la boutique'
    parameters:
      -
        name: fits_my_vehicle
        in: query
        schema:
          type: boolean
          default: false
    responses:
      200:
        description: ''
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  description: 'Message prêt à afficher, en français.'
                data:
                  type: array
                  items:
                    $ref: ../components/schemas/ProductResource.yaml
                meta:
                  type: object
                  description: 'Pagination par curseur : `per_page`, `next_cursor` (`null` sur la dernière page).'
                links:
                  type: object
                  description: "Liens de pagination (`next`, `prev`) lorsqu'ils existent."
              required:
                - message
                - data
      401:
        $ref: ../components/responses/AuthenticationException.yaml
/shop/pickup-points:
  get:
    operationId: v1.shop.pickup-points
    description: |-
      Les agences ouvertes au retrait, triées par nom. Un identifiant de cette
      liste alimente `pickup_point_id` à la commande.

      Liste courte et non paginée : la réponse porte toutes les agences.
    summary: 'Points de retrait'
    responses:
      200:
        description: ''
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  description: 'Message prêt à afficher, en français.'
                data:
                  type: array
                  items:
                    $ref: ../components/schemas/PickupPointResource.yaml
              required:
                - message
                - data
      401:
        $ref: ../components/responses/AuthenticationException.yaml
/shop/orders:
  get:
    operationId: v1.shop.orders.index
    description: 'Les commandes du conducteur, de la plus récente à la plus ancienne.'
    summary: 'Mes commandes'
    responses:
      200:
        description: ''
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  description: 'Message prêt à afficher, en français.'
                data:
                  type: array
                  items:
                    $ref: ../components/schemas/ShopOrderResource.yaml
                meta:
                  type: object
                  description: 'Pagination par curseur : `per_page`, `next_cursor` (`null` sur la dernière page).'
                links:
                  type: object
                  description: "Liens de pagination (`next`, `prev`) lorsqu'ils existent."
              required:
                - message
                - data
      401:
        $ref: ../components/responses/AuthenticationException.yaml
  post:
    operationId: v1.shop.orders.store
    description: |-
      Rend la commande créée. En retrait, la réponse porte le code à six
      chiffres à présenter au comptoir.

      La carte grise du véhicule est exigée : joindre les deux photos dans
      `documents[]`, ce qui fait de cette requête un envoi
      `multipart/form-data`. Rien à déclarer sur l'ordre des photos.

      L'en-tête `Idempotency-Key` (UUID) est obligatoire : renvoyer deux fois
      la même requête ne crée qu'une commande. L'empreinte d'un envoi
      multipart porte sur les champs et le contenu des fichiers, pas sur le
      corps brut.
    summary: 'Passer commande'
    parameters:
      -
        $ref: ../components/parameters/IdempotencyKey.yaml
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            $ref: ../components/schemas/StoreShopOrderRequest.yaml
    responses:
      201:
        description: ''
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  description: 'Message prêt à afficher, en français.'
                data:
                  $ref: ../components/schemas/ShopOrderResource.yaml
              required:
                - message
                - data
      422:
        $ref: ../components/responses/ValidationException.yaml
      401:
        $ref: ../components/responses/AuthenticationException.yaml
      409:
        $ref: ../components/responses/Conflict.yaml
'/shop/orders/documents/{document}':
  get:
    operationId: v1.shop.orders.documents.show
    description: |-
      Accessible par URL signée seulement : le fichier vit sur le disque privé
      et n'a pas d'URL publique. Répond 403 pour la photo d'un autre
      conducteur — l'URL signée en atteste, la vérification aussi.
    summary: 'Télécharger une photo de la carte grise'
    parameters:
      -
        name: document
        in: path
        required: true
        description: 'The document ID'
        schema:
          type: string
    responses:
      200:
        description: 'Le fichier, servi depuis le disque privé.'
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      403:
        description: 'An error'
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  description: 'Message prêt à afficher, en français.'
              required:
                - message
      401:
        $ref: ../components/responses/AuthenticationException.yaml
'/shop/orders/{order}':
  get:
    operationId: v1.shop.orders.show
    description: |-
      Une commande d'un autre conducteur répond 404 : rien ne fuit d'un compte
      à l'autre.
    summary: "Détail d'une commande"
    parameters:
      -
        name: order
        in: path
        required: true
        description: 'The order ID'
        schema:
          type: string
    responses:
      200:
        description: ''
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  description: 'Message prêt à afficher, en français.'
                data:
                  $ref: ../components/schemas/ShopOrderResource.yaml
              required:
                - message
                - data
      404:
        $ref: ../components/responses/ModelNotFoundException.yaml
      401:
        $ref: ../components/responses/AuthenticationException.yaml
