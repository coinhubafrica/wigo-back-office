type: object
properties:
  id:
    type: string
    examples:
      - 01HZY3M4N5P6Q7R8S9T0V1W2X3
  ref:
    type: string
    examples:
      - CMD-2026-0114
  status:
    type: string
    enum:
      - ordered
      - ready
      - out_for_delivery
      - collected
      - delivered
      - cancelled
  status_label:
    type: string
    enum:
      - Commandée
      - Prête
      - 'En livraison'
      - Retirée
      - Livrée
      - Annulée
  fulfilment_mode:
    type: string
    enum:
      - pickup
      - delivery
  pickup_code:
    type:
      - string
      - 'null'
    description: 'Code à présenter au comptoir. `null` pour une livraison.'
    examples:
      - '482913'
  total:
    type: integer
    description: 'Total en FCFA.'
    examples:
      - 22500
  lines:
    type: array
    items:
      type: object
      properties:
        product_id:
          type:
            - string
            - 'null'
          examples:
            - 01HZY3M4N5P6Q7R8S9T0V1W2X3
        name:
          type: string
          examples:
            - 'Amortisseur avant Dzire'
        qty:
          type: integer
          examples:
            - 1
        price:
          type: integer
          examples:
            - 22500
        line_total:
          type: integer
          examples:
            - 22500
      required:
        - product_id
        - name
        - qty
        - price
        - line_total
  documents:
    type: array
    items:
      $ref: ../../components/schemas/ShopOrderDocumentResource.yaml
    description: |-
      Carte grise du véhicule, les deux photos transmises à la
      commande. Chacune porte une URL signée valable une heure.
  placed_at:
    type: string
    examples:
      - '2026-08-29T09:42:11Z'
  ready_at:
    type:
      - string
      - 'null'
    description: Mise à disposition. `null` tant que la commande n'est pas prête.
    examples:
      - '2026-08-30T11:02:00Z'
  dispatched_at:
    type:
      - string
      - 'null'
    description: Remise au livreur. `null` hors livraison, ou avant le départ.
    examples:
      - '2026-08-30T14:20:00Z'
  completed_at:
    type:
      - string
      - 'null'
    description: Retrait au comptoir ou livraison effective.
    examples:
      - '2026-08-31T09:15:00Z'
  cancelled_at:
    type:
      - string
      - 'null'
    examples:
      - '2026-08-30T16:45:00Z'
  cancellation_reason:
    type:
      - string
      - 'null'
    description: |-
      Motif d'annulation, tel que saisi au back-office. `null` tant que la
      commande n'est pas annulée.
    examples:
      - Pièce indisponible chez le fournisseur
required:
  - id
  - ref
  - status
  - status_label
  - fulfilment_mode
  - pickup_code
  - total
  - placed_at
  - ready_at
  - dispatched_at
  - completed_at
  - cancelled_at
  - cancellation_reason
title: ShopOrderResource
