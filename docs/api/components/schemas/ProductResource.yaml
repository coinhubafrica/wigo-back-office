type: object
properties:
  id:
    type: string
    examples:
      - 01HZY3M4N5P6Q7R8S9T0V1W2X3
  reference:
    type: string
    examples:
      - PRD-AMORT-DZR
  name:
    type: string
    examples:
      - 'Amortisseur avant Dzire'
  description:
    type:
      - string
      - 'null'
    examples:
      - 'Amortisseur avant compatible SUZUKI Dzire, pose incluse.'
  category:
    type:
      - string
      - 'null'
    examples:
      - Suspension
  vehicle_model:
    type:
      - string
      - 'null'
    description: 'Modèle compatible, `null` pour une pièce universelle.'
    examples:
      - 'SUZUKI Dzire'
  price:
    type: integer
    description: 'Prix unitaire en FCFA.'
    examples:
      - 45000
  is_active:
    type: boolean
    description: "Référence ouverte à la commande. Le catalogue ne suit pas de stock : une pièce fermée est masquée du catalogue mobile."
    examples:
      - true
  image_url:
    type:
      - string
      - 'null'
    examples:
      - 'https://cdn.wigopro.example/products/amortisseur-dzire.jpg'
required:
  - id
  - reference
  - name
  - description
  - price
  - is_active
  - image_url
title: ProductResource
