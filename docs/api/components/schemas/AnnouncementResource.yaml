type: object
properties:
  id:
    type: string
    examples:
      - 01HZY3M4N5P6Q7R8S9T0V1W2X3
  title:
    type: string
    examples:
      - 'Nouveau bonus surprise cette semaine !'
  media_type:
    type: string
    enum:
      - image
      - video
  media_url:
    type: string
    examples:
      - 'https://cdn.wigopro.example/announcements/bonus-surprise.jpg'
  duration:
    type: integer
    description: >-
      Durée d'affichage de la diapositive sur l'accueil, en secondes. Vaut pour
      les deux types de média : faire défiler au bout de ce délai, sans lire les
      métadonnées de la vidéo.
    minimum: 1
    maximum: 60
    examples:
      - 5
  order:
    type: integer
    examples:
      - 1
required:
  - id
  - title
  - media_type
  - media_url
  - duration
  - order
title: AnnouncementResource
